<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaket Ölçüm Animasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
 --bg:#f3f4f1; --fg:#1d2024; --muted:#5d636b; --line:#d5d8d2; --panel:#ffffff; --soft:#eceee9;
 --accent:#b9770e; --ok:#2e8a4a; --warn:#b4472a;
 --display:"Barlow Condensed","Arial Narrow",sans-serif;
 --body:"Barlow",system-ui,sans-serif;
 --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#15171a; --fg:#e7e9ec; --muted:#9aa1ab; --line:#2c3036; --panel:#1d2024; --soft:#24282d;
 --accent:#e7a33a; --ok:#58c07a; --warn:#e2785c; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#15171a; --fg:#e7e9ec; --muted:#9aa1ab; --line:#2c3036; --panel:#1d2024; --soft:#24282d;
 --accent:#e7a33a; --ok:#58c07a; --warn:#e2785c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body);margin:0}
.wrap{max-width:1560px;margin:0 auto;padding:18px 16px 50px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(26px,4vw,38px)/1.05 var(--display);margin:2px 0 0}
code{font-family:var(--mono);font-size:.9em}

/* Adım şeridi */
.strip{display:flex;flex-wrap:wrap;gap:4px 14px}
.strip .grp{display:flex;gap:3px;align-items:center}
.strip .grp b{font:600 11px var(--mono);color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.strip button{width:26px;height:26px;padding:0;border-radius:50%;font:600 11px var(--mono);border:1.5px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.strip button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.strip button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.strip button.bad{background:var(--warn);border-color:var(--warn);color:#fff}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.fig{background:#e4e7e1;border:1px solid var(--line);border-radius:10px;overflow:auto}
.fig svg{display:block;width:100%;min-width:860px;height:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.meta{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.ttl{font:700 26px/1.1 var(--display);margin:0}
.do{margin:0}
.lbl{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.expect{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:8px 12px}
.expect .v{font:700 20px var(--mono)}
.expect .mode{font:600 12px var(--mono);color:var(--accent)}
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer input{width:120px;font:700 22px var(--mono);padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.answer input:focus{outline:none;border-color:var(--accent)}
.answer .u{font:600 18px var(--mono);color:var(--muted)}
button{font:600 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.res{display:none;border-radius:8px;padding:8px 12px;font:700 16px var(--display);letter-spacing:.03em}
.res.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok);color:var(--ok)}
.res.bad{display:block;background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);color:var(--warn)}
.checks{display:grid;gap:6px}
.checks.alert .lbl{color:var(--warn)}
.chk{display:flex;gap:8px;align-items:flex-start;text-align:left;font:400 14px/1.4 var(--body);padding:8px 10px;border-radius:8px;background:var(--soft);border:1px solid transparent;width:100%}
.chk:hover,.chk.sel{border-color:var(--accent)}
.chk i{font-style:normal;font:700 12px var(--mono);color:var(--accent);flex:none;margin-top:1px}
.nav{display:flex;gap:8px;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.final{display:none}
.final.show{display:block}
.vrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.tag{font:600 12px var(--mono);padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--warn);border-color:var(--warn)}

/* Plaket çizim sınıfları (montaj rehberinden) */
.pbl{font:600 13px var(--display);fill:#fff;paint-order:stroke;stroke:#3a2410;stroke-width:3px;stroke-linejoin:round}
.pbp{font:600 9.5px var(--mono);fill:#fff;paint-order:stroke;stroke:#1b1d20;stroke-width:3px;stroke-linejoin:round}
.pgh{fill:none;stroke:#fff;stroke-opacity:.7;stroke-width:1.5;stroke-dasharray:5 4}
.pdash{fill:none;stroke-width:3;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.redd{stroke:#ff6b6b}.yeld{stroke:#ffd84d}.orgd{stroke:#ff9a3c}.blkd{stroke:#1b1d20}.blud{stroke:#3d7cff}.grnd{stroke:#29c45a}.purd{stroke:#b48cf0}
.bbn{paint-order:stroke;stroke:#f6f5f0;stroke-width:4px;stroke-linejoin:round}
.bbr{font:700 15px var(--mono)}
.bbs{font:500 9.5px var(--mono);fill:#23262b}
.blk.c{stroke:#2b2d30}.blk.o{stroke:#000}
.blu.c{stroke:#2f6fd6}.blu.o{stroke:#132f63}
.grn.c{stroke:#2e9e4f}.grn.o{stroke:#124a22}
.org.c{stroke:#f07f1a}.org.o{stroke:#7f3f00}
.pur.c{stroke:#8e5bd1}.pur.o{stroke:#3d2366}
.red.c{stroke:#d62828}.red.o{stroke:#6e0f0f}
.yel.c{stroke:#f2c230}.yel.o{stroke:#7d5f00}
svg .c{fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
svg .o{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
svg .h{fill:none;stroke:#fff;stroke-opacity:.38;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.lead{stroke:#a9aeb5;stroke-width:3;stroke-linecap:round}
.pbb{font:600 12.5px var(--display);fill:#23262b;paint-order:stroke;stroke:#f6f5f0;stroke-width:4px;stroke-linejoin:round}
.pbs{font:500 10.5px var(--body);fill:#fff;paint-order:stroke;stroke:#3a2410;stroke-width:3px;stroke-linejoin:round}
.pg{font:500 9.5px var(--mono);fill:#5d636b}
.pin{font:500 11.5px var(--mono);fill:#23262b}
.silk{font:500 10px var(--mono);fill:#f2f5f8}

/* Animasyon katmanı */
.flow{fill:none;stroke:#ffb020;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 9;animation:march .7s linear infinite;filter:drop-shadow(0 0 4px #ffb020)}
@keyframes march{to{stroke-dashoffset:-19}}
.hlw{fill:none;stroke:#ff3d7f;stroke-width:14;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round;animation:blink 1s ease-in-out infinite}
.hlb{fill:#ff3d7f;fill-opacity:.12;stroke:#ff3d7f;stroke-width:3;stroke-dasharray:8 5;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.ring{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.jump{fill:none;stroke:#ff8a00;stroke-width:6;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s ease-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.callout{font:700 13px var(--mono);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.xmark{stroke:#d62828;stroke-width:5;stroke-linecap:round}

@media (max-width:1100px){
 .main{grid-template-columns:1fr}
 .panel{position:static;max-height:none}
}
</style>
</head>

const vsIdx = S.findIndex(s => s.vs);
const vs = () => { const v = parseFloat(String(st.v[vsIdx] ?? '').replace(',', '.')); return isFinite(v) && v > 0 ? v : 12.4; };
const L = x => typeof x === 'function' ? x(vs()) : x;
const fmt = (x, d = 2) => x.toFixed(d).replace('.', ',');

function result(i) {
 const s = S[i], v = st.v[i];
 if (v === undefined || v === '') return null;
 if (s.type === 'yn') return v === s.exp;
 const n = num(s, v);
 return isFinite(n) ? n >= L(s.min) && n <= L(s.max) : null;
}
// Ekranda mV (diyot) ya da kΩ gösteren multimetreler için birim düzeltme
function num(s, v) {
 const n = parseFloat(String(v).replace(',', '.'));
 if (s.scale === 'm' && n > 5) return n / 1000;
 if (s.scale === 'k' && n > 0 && n < 5) return n * 1000;
 return n;
}
function dispVal(s) {
 if (s.disp) return s.disp;
 if (s.type !== 'v') return '';
 const t = L(s.typ);
 return s.u === 'Ω' ? String(Math.round(t)) : fmt(t);
}
function expText(s) {
 if (s.type === 'yn') return s.mode === 'bip' ? (s.exp === 'y' ? 'bip sesi' : 'ses yok · OL') : '';
 const u = s.u, d = u === 'Ω' ? 0 : 2;
 return `${fmt(L(s.min), d)} … ${fmt(L(s.max), d)} ${u}`;
}

 const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
 return new Promise(done => {
  const step = now => {
   if (id !== anim) return;
   const k = ms ? ease(Math.min(1, Math.max(0, (now - t0) / ms))) : 1;
   for (const c of ['red', 'black']) {
    const p = [from[c][0] + (to[c][0] - from[c][0]) * k, from[c][1] + (to[c][1] - from[c][1]) * k];
    cur[c] = p; probe(c, p);
   }
   k < 1 ? requestAnimationFrame(step) : done();
  };
  requestAnimationFrame(step);
 });
}

function lcd(text, unit) {
 document.getElementById('lcd').textContent = text;
 document.getElementById('lcdu').textContent = unit || '';
}
function countTo(s) {
 const target = dispVal(s);
 const n = parseFloat(String(target).replace(',', '.'));
 if (!isFinite(n)) { lcd(target, s.mode === 'bip' ? '♪' : ''); return; }
 const d = s.u === 'Ω' ? 0 : 2, t0 = performance.now(), id = anim;
 const unit = s.u === 'Ω' ? 'Ω' : s.mode === 'diyot' ? '▷| V' : 'V DC';
 const tick = now => {
  if (id !== anim) return;
  const k = FAST ? 1 : Math.min(1, Math.max(0, (now - t0) / 650));
  lcd(fmt(n * k * (1 + (Math.random() - .5) * .08), d), unit);
  k < 1 ? requestAnimationFrame(tick) : lcd(fmt(n, d), unit);
 };
 requestAnimationFrame(tick);
}

function ring(p, color, label, below) {
 const [x, y] = p;
 return `<circle class="ring" cx="${x}" cy="${y}" r="10" stroke="${color}"/>
  <circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${color}" stroke-width="3"/>
  ${label ? `<text class="callout" x="${x}" y="${below ? y + 30 : y - 18}" text-anchor="middle" style="fill:${color}">${label}</text>` : ''}`;
}
function hlHtml(what) {
 if (W[what]) return `<path class="hlw" d="${wPath(what)}"/>`;
 if (B[what]) { const [x, y, w, h] = box(what); return `<rect class="hlb" x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" rx="8"/>`; }
 return '';
}

let selCheck = -1;
function drawFx(s) {
 let h = '';
 // 1. adımda çıkarılan ESP TX/RX telleri son adıma kadar soluk
 if (st.i > 0 && st.i < S.length - 1) h += ['espRx', 'espTx'].map(w => `<path d="${wPath(w)}" fill="none" stroke="#e6e7e2" stroke-opacity=".85" stroke-width="12" stroke-linecap="round"/>`).join('');
 for (const f of s.flow || []) h += `<path class="flow" d="${wPath(f)}"/>`;
 for (const w of s.hl || []) h += hlHtml(w);
 if (selCheck >= 0 && s.checks[selCheck]) h += hlHtml(s.checks[selCheck][1]);
 for (const m of s.xmark || []) {
  const [x, y] = P(m);
  h += `<path class="xmark" d="M${x - 12} ${y - 12}L${x + 12} ${y + 12}M${x + 12} ${y - 12}L${x - 12} ${y + 12}"/>`;
 }
 if (s.xmark) {
  const [x, y] = P(s.xmark[0]);
  h += `<text class="callout" x="${x + 12}" y="${y + 36}" text-anchor="middle" style="fill:#d62828">çıkar</text>`;
 }
 if (s.jump) {
  const [a, b] = s.jump.map(P), mx = (a[0] + b[0]) / 2 + 40, my = (a[1] + b[1]) / 2;
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]) * 1.3 + 40;
  h += `<path class="jump" style="--len:${len}" d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}"/>
   <rect x="${a[0] - 5}" y="${a[1] - 5}" width="10" height="10" rx="2" fill="#ff8a00"/>
   <rect x="${b[0] - 5}" y="${b[1] - 5}" width="10" height="10" rx="2" fill="#ff8a00"/>`;
 }
 if (s.red) h += ring(P(s.red), '#d62828');
 if (s.black && s.black !== GND) h += ring(P(s.black), '#151515');
 // Alt açıklama: hangi uç nereye
 const leg = [];
 if (s.red) leg.push(['#d62828', 'Kırmızı prob', where(s.red)]);
 if (s.black) leg.push(['#151515', 'Siyah prob', where(s.black)]);
 if (s.jump) leg.push(['#ff8a00', 'Atlama kablosu', `${where(s.jump[0])} → ${where(s.jump[1])}`]);
 h += leg.map(([c, a, b], k) => `<g transform="translate(${MIR ? -80 : -290} ${482 + k * 18})">
  <rect x="0" y="-11" width="22" height="12" rx="3" fill="${c}"/>
  <text x="30" y="0" style="font:700 13px var(--mono);fill:#23262b">${a}: <tspan style="font-weight:500">${b}</tspan></text></g>`).join('');
 fx.innerHTML = h;
}

function play() {
 const s = S[st.i];
 timers.forEach(clearTimeout); timers = [];
 document.getElementById('knob').style.transform = `rotate(${KNOB[s.mode] ?? 0}deg)`;
 lcd(s.mode ? '----' : 'OFF', '');
 drawFx(s);
 const to = {red:s.red ? P(s.red) : PARK.red, black:s.black ? P(s.black) : PARK.black};
 timers.push(setTimeout(() => moveProbes(to, FAST ? 0 : 900).then(() => { if (s.mode && (s.red || s.disp)) countTo(s); }), s.jump ? 700 : 150));
}

// ---- Panel ----
function show(animate = true) {
 const s = S[st.i];
 selCheck = -1;
 $('grp').textContent = s.g;
 $('cnt').textContent = `${st.i + 1} / ${S.length}`;
 $('ttl').textContent = s.t;
 $('do').innerHTML = s.do;
 const disp = dispVal(s);
 $('ev').textContent = s.type === 'v' ? expText(s) : (expText(s) || '—');
 $('em').textContent = s.mode ? `mod: ${s.mode === 'V' ? 'V⎓' : s.mode}` + (s.type === 'v' ? ` · tipik ${disp} ${s.u}` : '') : '';
 if (s.type === 'yn') {
  $('alab').textContent = s.q;
  $('answer').innerHTML = `<button data-v="y">Evet</button><button data-v="n">Hayır</button>`;
  $('answer').querySelectorAll('button').forEach(b => {
   b.classList.toggle('on', st.v[st.i] === b.dataset.v);
   b.onclick = () => { st.v[st.i] = b.dataset.v; save(); panelState(); };
  });
 } else {
  $('alab').textContent = 'Ölçtüğün değer';
  $('answer').innerHTML = `<input id="inp" inputmode="decimal" placeholder="—" value="${st.v[st.i] ?? ''}"><span class="u">${s.u}</span>`;
  $('inp').oninput = e => { st.v[st.i] = e.target.value.trim(); save(); panelState(); };
  $('inp').onkeydown = e => { if (e.key === 'Enter') go(1); };
 }
 $('prev').disabled = st.i === 0;
 $('next').textContent = st.i === S.length - 1 ? 'Sonuç' : 'İleri →';
 panelState();
 if (animate) play();
}

function panelState() {
 const s = S[st.i], r = result(st.i);
 if (s.type === 'yn') $('answer').querySelectorAll('button').forEach(b => b.classList.toggle('on', st.v[st.i] === b.dataset.v));
 $('res').className = 'res' + (r === true ? ' ok' : r === false ? ' bad' : '');
 const raw = parseFloat(String(st.v[st.i] ?? '').replace(',', '.'));
 const conv = s.type === 'v' && r !== null && num(s, st.v[st.i]) !== raw ? ` (${st.v[st.i]} → ${fmt(num(s, st.v[st.i]), s.u === 'Ω' ? 0 : 3)} ${s.u})` : '';
 $('res').textContent = (r === true ? 'GEÇTİ' : r === false ? 'HATALI · aşağıdakileri sırayla kontrol et' : '') + conv;
 const c = $('checks');
 c.className = 'checks' + (r === false ? ' alert' : '');
 c.innerHTML = s.checks.length ? `<div class="lbl">${r === false ? 'Kontrol et (tıkla, çizimde gösterir)' : 'Değer tutmazsa kontrol et'}</div>` +
  s.checks.map(([t], k) => `<button class="chk${k === selCheck ? ' sel' : ''}" data-k="${k}"><i>${k + 1}</i><span>${t}</span></button>`).join('') : '';
 c.querySelectorAll('.chk').forEach(b => b.onclick = () => {
  selCheck = selCheck === +b.dataset.k ? -1 : +b.dataset.k;
  drawFx(S[st.i]); panelState();
 });
 strip(); final();
}

function strip() {
 let h = '', g = '', open = false;
 S.forEach((s, i) => {
  if (s.g !== g) { if (open) h += '</span>'; g = s.g; h += `<span class="grp"><b>${g}</b>`; open = true; }
  const r = result(i);
  h += `<button data-i="${i}" title="${s.t}" class="${i === st.i ? 'cur ' : ''}${r === true ? 'ok' : r === false ? 'bad' : ''}">${i + 1}</button>`;
 });
 $('strip').innerHTML = h + '</span>';
 $('strip').querySelectorAll('button').forEach(b => b.onclick = () => { st.i = +b.dataset.i; save(); show(); });
}

// Sonuç: grup bazında
function final() {
 const el = $('final');
 if (st.i !== S.length - 1) { el.className = 'final'; return; }
 const groups = [...new Set(S.map(s => s.g))];
 const tag = g => {
  const r = S.map((s, i) => [s, result(i)]).filter(([s]) => s.g === g).map(([, r]) => r);
  return r.includes(false) ? '<span class="tag bad">HATA</span>' : r.every(x => x === true) ? '<span class="tag ok">TAMAM</span>' : '<span class="tag">eksik</span>';
 };
 const firstBad = S.findIndex((s, i) => result(i) === false);
 el.className = 'final show';
 el.innerHTML = `<div class="lbl">Özet</div>` + groups.map(g => `<div class="vrow"><span>${g}</span>${tag(g)}</div>`).join('') +
  (firstBad >= 0 ? `<p style="margin:10px 0 0">İlk hata: <b>${firstBad + 1}. ${S[firstBad].t}</b>. Önce onu düzelt.</p>`
   : '<p style="margin:10px 0 0">Hata yoksa plaket, L9637D ve dönüştürücü sağlam: kalan şüpheli Waveshare tarafı (UART Type-C, RXD/TXD yönü) ve J2 kablosu.</p>');
}

function go(d) {
 const n = Math.max(0, Math.min(S.length - 1, st.i + d));
 if (n === st.i) return;
 st.i = n; save(); show();
}

$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('vBot').onclick = () => { setView('bot'); save(); cur = {red:PARK.red, black:PARK.black}; play(); };
$('vTop').onclick = () => { setView('top'); save(); cur = {red:PARK.red, black:PARK.black}; play(); };
$('replay').onclick = () => { cur = {red:PARK.red, black:PARK.black}; play(); };
$('reset').onclick = () => { if (confirm('Tüm ölçümler silinsin mi?')) { st = {v:{}, i:0, view:st.view}; save(); show(); } };
$('copy').onclick = async () => {
 const lines = ['Plaket ölçüm testi · ' + new Date().toLocaleString('tr-TR')];
 S.forEach((s, i) => {
  const r = result(i);
  if (r === null) return;
  const v = s.type === 'yn' ? (st.v[i] === 'y' ? 'evet' : 'hayır') : `${st.v[i]} ${s.u}`;
  lines.push(`${r ? 'OK  ' : 'HATA'} ${i + 1}. ${s.t}: ${v}${s.type === 'v' ? ` (beklenen ${expText(s)})` : ''}`);
 });
 const txt = lines.join('\n');
 try { await navigator.clipboard.writeText(txt); alert('Kopyalandı'); } catch (e) { prompt('Kopyala:', txt); }
};
document.addEventListener('keydown', e => {
 if (e.target.tagName === 'INPUT') return;
 if (e.key === 'ArrowRight') go(1);
 if (e.key === 'ArrowLeft') go(-1);
});

setView(st.view === 'top' ? 'top' : 'bot');
probe('red', PARK.red); probe('black', PARK.black);
const hashStep = parseInt(location.hash.slice(1));
if (hashStep >= 1 && hashStep <= S.length) st.i = hashStep - 1;
show();
</script>
</body>
</html>
